name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches script version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          script=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' positron-remote.sh)
          if [ "$tag" != "$script" ]; then
            echo "Tag v$tag does not match VERSION=$script in positron-remote.sh" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $tag" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
